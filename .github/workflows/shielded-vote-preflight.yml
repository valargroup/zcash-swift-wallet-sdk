name: Shielded Vote Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/shielded-vote-preflight.yml"
      - "Scripts/shielded-vote-preflight.sh"
      - "docs/shielded-vote-pr-preflight.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "rust/**"
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      PREFLIGHT_BASE_REF: shielded-vote-2.4.10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Fetch shielded-vote comparison branch
        run: git fetch origin "${PREFLIGHT_BASE_REF}:refs/remotes/origin/${PREFLIGHT_BASE_REF}"

      - name: Run shielded-vote preflight
        run: Scripts/shielded-vote-preflight.sh "origin/${PREFLIGHT_BASE_REF}"
